name: Build Fake kmod-dummy APK (ARMv8)

on:
  workflow_dispatch:
    inputs:
      sdk_url:
        description: 'OpenWrt SDK Download URL'
        required: true
        default: 'https://downloads.openwrt.org/releases/25.12.4/targets/armsr/armv8/openwrt-sdk-25.12.4-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # 已经补充安装了 python3-pyelftools 解决 u-boot 预检失败问题
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext unzip file wget rsync zstd python3-pyelftools

      - name: Download and extract SDK
        run: |
          EXT="${{ github.event.inputs.sdk_url }}"
          EXT="${EXT##*.}"
          
          wget "${{ github.event.inputs.sdk_url }}" -O sdk.tar.${EXT}
          mkdir sdk
          
          if [ "$EXT" = "zst" ]; then
            tar -I zstd -xf sdk.tar.zst -C sdk --strip-components=1
          else
            tar -xf sdk.tar.xz -C sdk --strip-components=1
          fi

      - name: Create Fake kmod-dummy package
        run: |
          mkdir -p sdk/package/kmod-dummy
          echo 'include $(TOPDIR)/rules.mk' > sdk/package/kmod-dummy/Makefile
          echo 'PKG_NAME:=kmod-dummy' >> sdk/package/kmod-dummy/Makefile
          echo 'PKG_VERSION:=9.9.9' >> sdk/package/kmod-dummy/Makefile
          echo 'PKG_RELEASE:=1' >> sdk/package/kmod-dummy/Makefile
          echo 'include $(INCLUDE_DIR)/package.mk' >> sdk/package/kmod-dummy/Makefile
          echo 'define Package/kmod-dummy' >> sdk/package/kmod-dummy/Makefile
          echo '  SECTION:=kernel' >> sdk/package/kmod-dummy/Makefile
          echo '  CATEGORY:=Kernel modules' >> sdk/package/kmod-dummy/Makefile
          echo '  SUBMENU:=Network Devices' >> sdk/package/kmod-dummy/Makefile
          echo '  TITLE:=Fake kmod-dummy to satisfy dependencies' >> sdk/package/kmod-dummy/Makefile
          echo 'endef' >> sdk/package/kmod-dummy/Makefile
          echo 'define Package/kmod-dummy/description' >> sdk/package/kmod-dummy/Makefile
          echo '  This is a fake kmod-dummy package designed to bypass dependency checks.' >> sdk/package/kmod-dummy/Makefile
          echo 'endef' >> sdk/package/kmod-dummy/Makefile
          echo 'define Build/Compile' >> sdk/package/kmod-dummy/Makefile
          echo 'endef' >> sdk/package/kmod-dummy/Makefile
          echo 'define Package/kmod-dummy/install' >> sdk/package/kmod-dummy/Makefile
          echo 'endef' >> sdk/package/kmod-dummy/Makefile
          echo '$(eval $(call BuildPackage,kmod-dummy))' >> sdk/package/kmod-dummy/Makefile

      - name: Configure and compile
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "CONFIG_PACKAGE_kmod-dummy=y" >> .config
          make defconfig
          make package/kmod-dummy/compile V=s -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kmod-dummy-fake-armv8
          path: |
            sdk/bin/packages/*/*/kmod-dummy*.apk
